[pytest]
testpaths = tests

# stricttest safety keys. All five are required; there are no defaults.
stricttest_sockets = deny
stricttest_socket_allowlist =
stricttest_unix_socket_allowlist =
stricttest_loopback = deny
stricttest_sandbox_required = false

# Optional: this project builds Go artifacts in some tests, so it keeps the Go
# caches warm across the HOME repoint.
stricttest_preserve =
    go_path
    go_cache
