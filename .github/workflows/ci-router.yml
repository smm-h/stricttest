# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stricttest: ${{ steps.changes.outputs.stricttest }}
      go-stricttest: ${{ steps.changes.outputs.go-stricttest }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          stricttest:
            - 'python/**'
            - 'python/**'
            - 'LICENSE'
          go-stricttest:
            - 'go/**'
            - 'go/**'
            - 'LICENSE'
  stricttest-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.11
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install ${{ matrix.python-version }}
    - run: uv sync --locked
    - run: uv run python -c "import stricttest"
    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.24.3
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
    - run: uv run pytest --rootdir .
    defaults:
      run:
        working-directory: python
    name: stricttest-ci / test
    needs:
    - detect
    if: needs.detect.outputs.stricttest == 'true'
  go-stricttest-ci-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      # go.mod: go 1.25.0
    - uses: actions/setup-go@v6
      with:
        go-version-file: go/go.mod
    - run: go vet ./...
    - run: go test ./... -race -short -timeout=10m
    defaults:
      run:
        working-directory: go
    name: go-stricttest-ci / test
    needs:
    - detect
    if: needs.detect.outputs.go-stricttest == 'true'
